name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check all JS
        run: |
          node --check js/todo.js
          node --check js/offline-store.js
          node --check js/supabase.config.js
          node --check sw.js

      - name: Run unit tests (view logic, offline queue, theme/toast/undo)
        run: npm test

      - name: Smoke test — app boots without errors in a headless parse
        run: node -e "
          const fs = require('fs');
          const html = fs.readFileSync('todo.html', 'utf8');
          ['css/todo.css','js/todo.js','js/offline-store.js','js/supabase.config.js','js/supabase.env.js','manifest.json','sw.js','icons/icon-192.png','icons/icon-512.png','icons/icon-512-maskable.png']
            .forEach(f => { if (!fs.existsSync(f)) throw new Error('missing ' + f); });
          console.log('shell assets OK');
        "

      - name: Verify theme + manifest integrity
        run: node -e "
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.icons.length !== 3) throw new Error('icons missing');
          console.log('manifest OK');
        "